# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# The oldest versions Foreman builds against: fabric.mod.json requires them. Minecraft and Fabric API are set per version,
# in client/versions/<minecraft>/gradle.properties.
loader_version=0.19.3
loom_version=1.19.3
fabric_kotlin_version=1.13.12+kotlin.2.4.0

# Mod Properties
mod_name=foreman
mod_version=1.2.0
maven_group=games.qore

# Dependencies
modmenu_version=22.0.0-alpha.3
paper_version=26.2.build.135-stable
