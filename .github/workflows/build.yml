name: Build

# Every push to main and every pull request: the mod, the plugin and the APIs build, and so do the docs. The jars are
# attached to the run, to try a pull request without building it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            client/build/libs/foreman-*.jar
            !client/build/libs/*-sources.jar
            server/build/libs/foreman-server-*.jar

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r docs/requirements.txt
      - run: zensical build --clean --strict
